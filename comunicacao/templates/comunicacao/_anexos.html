{% if anexos %}
<ul class="simap-anexos" aria-label="Anexos da mensagem">
    {% for anexo in anexos %}
    <li>
        {% if anexo.eh_imagem %}
        <a href="{% url 'comunicacao:anexo' anexo.pk %}?ver=1" target="_blank" rel="noopener" class="simap-anexo-imagem">
            <img src="{% url 'comunicacao:anexo' anexo.pk %}?ver=1" alt="{{ anexo.nome_original }}" loading="lazy">
            <span>{{ anexo.nome_original }}</span><span class="visually-hidden"> (abre em nova aba)</span>
        </a>
        {% else %}
        <a href="{% url 'comunicacao:anexo' anexo.pk %}" class="simap-anexo-arquivo">
            <span>{{ anexo.nome_original }}</span><span class="simap-metadados">{{ anexo.tamanho_legivel }}</span>
        </a>
        {% endif %}
    </li>
    {% endfor %}
</ul>
{% endif %}
