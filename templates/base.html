<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SIMAP{% endblock %}</title>
    <!-- Importando o CSS do Bootstrap via CDN para estilizar rápido -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Aqui usamos o Partial para injetar o menu de navegação -->
    {% include 'partials/_navbar.html' %}

    <!-- O miolo do site, onde as telas vão renderizar de fato -->
    <main class="container mt-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <!-- ESTE É O BURACO PRINCIPAL -->
        {% block content %}
        {% endblock %}
    </main>

    <!-- Aqui usamos o Partial para injetar o rodapé -->
    {% include 'partials/_footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
