{% extends 'base.html' %}

{% block title %}Confirmar exclusão - SIMAP{% endblock %}

{% block content %}
<div class="simap-pagina simap-formulario-pagina">
    <a href="{{ view.success_url }}" class="simap-voltar">← Voltar para a listagem</a>
    <div>
        <div class="simap-cartao">
            <div class="simap-cartao-cabecalho">
                <h1 class="simap-titulo-confirmacao">Confirmar exclusão</h1>
            </div>
            <div class="simap-corpo-cartao">
                <p>Tem certeza que deseja excluir "<strong>{{ object }}</strong>"? Essa ação não pode ser desfeita.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="simap-formulario-acoes">
                        <a href="{{ view.success_url }}" class="simap-botao simap-botao-secundario">Cancelar</a>
                        <button type="submit" class="simap-botao simap-botao-perigo">Excluir</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
