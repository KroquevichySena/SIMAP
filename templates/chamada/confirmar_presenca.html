{% extends 'base.html' %}

{% block title %}Confirmar Presença - SIMAP{% endblock %}

{% block content %}
<style>
    .btn-presenca {
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-presenca:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }
    .btn-presenca:active {
        transform: scale(0.96);
    }
</style>

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">{{ titulo_pagina }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-success btn-presenca">Confirmar Presença</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
