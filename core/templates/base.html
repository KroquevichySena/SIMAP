<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}SIMAP{% endblock %}</title>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'lista_turmas' %}">SIMAP</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{% url 'lista_turmas' %}">Turmas</a>
            </li>
            <li class="nav-item">
            {% if user.is_authenticated and user.is_docente %}
                <a class="nav-link" href="{% url 'listar_trilhas' %}">Trilhas</a>
            {% elif user.is_authenticated and user.is_discente %}
                <a class="nav-link" href="{% url 'minhas_trilhas' %}">Trilhas</a>
            {% else %}
                <a class="nav-link disabled" href="#">Trilhas</a>
            {% endif %}
            </li>
            <li class="nav-item">
            <a class="nav-link" href="#">Presença</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="#">Painel</a>
            </li>                        
        </ul>
        </div>
    </div>
    </nav>
    <main class="container mt-4">
       {% block conteudo %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
